# OPCIONAL. El plan gratuito de Supabase pausa los proyectos con poca
# actividad durante 7 días. Esta tarea consulta el calendario público cada
# 3 días para mantenerlo activo. Necesita dos secretos del repositorio:
#   SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY (Settings → Secrets → Actions).
# Si no los defines, la tarea no hace nada.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar el calendario público
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secretos no configurados: no se hace nada."; exit 0
          fi
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/calendario_publico" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $codigo"
          test "$codigo" = "200"
